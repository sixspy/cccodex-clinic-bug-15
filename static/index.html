<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>临床试验访视采集台</title>
  <link rel="stylesheet" href="/static/css/clinic.css" />
</head>
<body>
  <div class="shell">
    <header class="ribbon">
      <div>
        <strong>临床试验访视采集台</strong>
        <span class="muted" id="dashHint"></span>
      </div>
      <button id="logoutBtn" class="ghost">退出</button>
    </header>
    <nav class="nav-row">
      <button data-page="sites" data-tab="sites" class="nav active">试验中心</button>
      <button data-page="visits" data-tab="visits" class="nav">访视批次</button>
      <button data-page="qc" data-tab="qc" class="nav">字段质控</button>
      <button data-page="backfill" data-tab="backfill" class="nav">缺口补采</button>
      <button data-page="reconcile" data-tab="reconcile" class="nav">访视对账</button>
      <button data-page="settings" data-tab="settings" class="nav">台参数</button>
    </nav>
    <section id="view" class="view"></section>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
