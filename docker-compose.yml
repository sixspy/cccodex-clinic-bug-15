services:
  clinic-lab:
    build: .
    container_name: cc-clinic-lab-clinic-bug-15
    ports:
      - "7635:7600"
    environment:
      HOST: "0.0.0.0"
      PORT: "7600"
      DATABASE_PATH: /app/instance/clinic_lab.db
    volumes:
      - clinic_lab_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7600/login', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  clinic_lab_data:
